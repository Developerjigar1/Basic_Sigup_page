<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lamp Login/Signup</title>
    <link rel="stylesheet" href="style.css"> </head>
<body>
    <div class="main-container">
        <div class="toggle-side">
            <button id="toggle-btn" class="lamp-off">💡</button>
            <p class="toggle-text">Click Lamp for Signup</p>
        </div>

        <div class="form-side">
            <div id="login-interface" class="interface active">
                <h2>Welcome Back!</h2>
                <form>
                    <input type="email" placeholder="Email" required>
                    <input type="password" placeholder="Password" required>
                    <button type="submit">LOGIN</button>
                </form>
            </div>

            <div id="signup-interface" class="interface hidden">
                <h2>Create Account</h2>
                <form>
                    <input type="text" placeholder="Username" required>
                    <input type="email" placeholder="Email" required>
                    <input type="password" placeholder="Password" required>
                    <input type="password" placeholder="Confirm Password" required>
                    <button type="submit" id="signup-submit-btn" class="hidden-button">SIGNUP</button>
                </form>
            </div>
        </div>
    </div>
    <script src="script.js"></script> </body>
</html>
